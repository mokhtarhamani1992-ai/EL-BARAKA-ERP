<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Al-Baraka Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;padding-bottom:84px}
#receipt{display:none}
@media print{body>*:not(#receipt){display:none!important}#receipt{display:block!important;padding:12px;font-size:13px}}
</style>
</head>
<body>
<header class="bg-blue-700 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
  <div id="h-title" class="font-black text-base"></div>
  <button onclick="toggleLanguage()" id="lang-btn" class="bg-white text-blue-700 px-3 py-1.5 rounded-xl text-xs font-black"></button>
</header>
<main id="main" class="p-3 max-w-lg mx-auto space-y-3"></main>
<nav id="nav" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 grid grid-cols-4 z-30" style="padding-bottom:env(safe-area-inset-bottom,0px)"></nav>
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-slate-900/70" onclick="closeModal()"></div>
  <div id="sheet" class="absolute inset-x-0 bottom-0 max-w-lg mx-auto bg-white rounded-t-3xl p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto"></div>
</div>
<div id="toast" class="fixed top-16 inset-x-0 mx-auto w-max max-w-[90%] bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl z-[60] hidden"></div>
<div id="receipt"></div>

<script>
const L={
app:['البركة Pro','Al-Baraka Pro'],cur:['د.ج','DA'],
sell:['البيع','Vente'],stock:['المخزون','Stock'],debts:['الديون','Crédits'],today:['اليوم','Aujourd\'hui'],
salesT:['المبيعات','Ventes'],profit:['الربح','Bénéfice'],expT:['المصاريف','Dépenses'],net:['الصافي','Net'],
search:['ابحث بالاسم أو الباركود ثم Enter','Nom ou code-barres puis Entrée'],walkIn:['زبون عابر','Client de passage'],newClient:['+ زبون','+ Client'],
cart:['السلة','Panier'],empty:['لا شيء بعد','Rien pour le moment'],total:['المجموع','Total'],paid:['المدفوع (فارغ = كامل)','Versé (vide = tout)'],rest:['المتبقي','Reste'],
validate:['تسجيل البيع','Valider la vente'],saved:['تم الحفظ','Enregistré'],noStock:['المخزون غير كاف: ','Stock insuffisant : '],notFound:['الباركود غير موجود','Code-barres introuvable'],
bon:['وصل','Bon'],print:['طباعة','Imprimer'],del:['حذف','Supprimer'],edit:['تعديل','Modifier'],confirmDel:['تأكيد الحذف؟','Confirmer ?'],
addItem:['+ سلعة','+ Article'],name:['الاسم','Nom'],price:['سعر البيع','Prix de vente'],cost:['سعر الشراء','Prix d\'achat'],qty:['الكمية','Quantité'],barcode:['الباركود (اختياري)','Code-barres (optionnel)'],low:['منخفض','Bas'],
phone:['الهاتف','Téléphone'],oldDebt:['دين سابق','Ancien crédit'],pay:['تسديد','Régler'],amount:['المبلغ','Montant'],paidOK:['تم تسجيل الدفعة','Paiement enregistré'],
cancel:['إلغاء','Annuler'],save:['حفظ','Enregistrer'],nameReq:['أدخل الاسم','Entrez un nom'],
exp:['مصروف جديد','Nouvelle dépense'],add:['إضافة','Ajouter'],label:['البيان','Libellé'],
wa:['حفظ نسخة + إرسال الملخص لواتساب','Sauvegarder + Bilan WhatsApp'],exp2:['تحميل نسخة','Exporter'],imp:['استرجاع نسخة','Restaurer'],
reset:['تفريغ البيانات التجريبية','Vider les données démo'],resetWarn:['سيتم حذف كل السلع والوصولات. حمّل نسخة احتياطية أولاً.','Tout sera effacé. Téléchargez d\'abord une sauvegarde.'],confirm:['تأكيد','Confirmer'],resetDone:['تم التصفير','Données effacées'],
imported:['تم الاسترجاع','Restauré'],badFile:['ملف غير صالح','Fichier invalide'],confirmImp:['سيتم استبدال البيانات الحالية. متابعة؟','Remplacer les données actuelles ?'],
history:['آخر الوصولات','Derniers bons']
};
let lang='ar';try{lang=localStorage.getItem('brk_lang')||'ar'}catch(e){}
const t=k=>(L[k]||[k,k])[lang==='ar'?0:1];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Number(v||0).toLocaleString('fr-FR')+' '+t('cur');
const day=()=>new Date().toLocaleDateString('en-CA');
const COMPTOIR=()=>({id:'p_comptoir',type:'client',name:'Comptoir',phone:'',balance:0});
const DEMO=[
{id:'1',barcode:'6130001001',name:'زيت المائدة 5 لتر',cost:580,retail:650,stock:40},
{id:'2',barcode:'6130001002',name:'كسكسى متوسط 1 كغ',cost:120,retail:150,stock:60},
{id:'3',barcode:'6130001003',name:'قهوة مطحونة 250غ',cost:260,retail:310,stock:45},
{id:'4',barcode:'6130001004',name:'حليب معقم 1 لتر',cost:105,retail:125,stock:72}];
let tab='sell',items=structuredClone(DEMO),parties=[COMPTOIR()],docs=[],expenses=[],cart=[],client='p_comptoir',q='',mem={};

/* ---------- التخزين ---------- */
const DB='AlBarakaERP_DB',ST='state_store';let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej('no idb');
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(ST))e.target.result.createObjectStore(ST)};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{dbP=null;rej(r.error)};
  });
  return dbP;
}
async function put(k,v){
  const s=JSON.stringify(v);mem[k]=s;let ok=false;
  try{localStorage.setItem(k,s);ok=true}catch(e){}
  try{const db=await idb();await new Promise((res,rej)=>{const x=db.transaction(ST,'readwrite');x.objectStore(ST).put(s,k);x.oncomplete=res;x.onerror=()=>rej(x.error)});ok=true}catch(e){}
  return ok;
}
async function get(k){
  try{const db=await idb();const v=await new Promise((res,rej)=>{const r=db.transaction(ST,'readonly').objectStore(ST).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)return JSON.parse(v)}catch(e){}
  try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}
  return mem[k]?JSON.parse(mem[k]):null;
}
async function load(){
  try{
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const [i,p,d,e]=await Promise.all(['brk_items','brk_parties','brk_docs','brk_expenses'].map(get));
    const first=i===null&&p===null&&d===null;
    if(Array.isArray(i))items=i;
    if(Array.isArray(p)&&p.length)parties=p;
    if(Array.isArray(d))docs=d;
    if(Array.isArray(e))expenses=e;
    if(!parties.some(x=>x.id==='p_comptoir'))parties.unshift(COMPTOIR());
    if(first)await persist();
  }catch(e){console.warn(e)}
}
async function persist(){
  const r=await Promise.all([put('brk_items',items),put('brk_parties',parties),put('brk_docs',docs),put('brk_expenses',expenses)]);
  if(!r.every(Boolean))toast('⚠ Storage error');
}

/* ---------- أدوات الواجهة ---------- */
let tm;function toast(m){const e=$('toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(tm);tm=setTimeout(()=>e.classList.add('hidden'),2500)}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
const inp='w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-bold bg-white';
const box='bg-white border border-slate-200 p-4 rounded-2xl';
const b=c=>`rounded-xl text-xs font-black py-2.5 ${c}`;
const fld=(id,l,v='',ty='text',x='')=>`<label class="block"><span class="font-black text-slate-600">${l}</span><input id="${id}" type="${ty}" value="${esc(v)}" ${x} class="${inp} mt-1"></label>`;
const btns=ok=>`<div class="grid grid-cols-2 gap-2 pt-2"><button type="button" onclick="closeModal()" class="bg-slate-100 ${b('')}">${t('cancel')}</button><button class="${ok} text-white ${b('')}">${t('save')}</button></div>`;
const pName=p=>p.id==='p_comptoir'?t('walkIn'):p.name;
function setTab(x){tab=x;render()}
function toggleLanguage(){lang=lang==='ar'?'fr':'ar';try{localStorage.setItem('brk_lang',lang)}catch(e){}render()}

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('h-title').textContent=t('app');$('lang-btn').textContent=lang==='ar'?'FR':'AR';
  const ic={sell:'🛒',stock:'📦',debts:'💳',today:'📊'};
  $('nav').innerHTML=Object.keys(ic).map(k=>`<button onclick="setTab('${k}')" class="py-2 text-[11px] font-black ${tab===k?'text-blue-700':'text-slate-500'}"><div class="text-lg">${ic[k]}</div>${t(k)}</button>`).join('');
  $('main').innerHTML=V[tab]();
  if(tab==='sell'){list();drawCart()}
}

/* ---------- الشاشات ---------- */
const V={
sell(){
  return `<div class="${box} space-y-2">
   <div class="flex gap-2"><select id="cl" onchange="client=this.value" class="${inp}">${parties.filter(p=>p.type==='client').map(p=>`<option value="${p.id}" ${p.id===client?'selected':''}>${esc(pName(p))}${p.balance>0?' ('+fmt(p.balance)+')':''}</option>`).join('')}</select>
   <button onclick="partyModal()" class="bg-slate-100 px-3 whitespace-nowrap ${b('')}">${t('newClient')}</button></div>
   <input id="q" value="${esc(q)}" placeholder="${t('search')}" oninput="q=this.value;list()" onkeydown="if(event.key==='Enter')byCode(this.value)" class="${inp}">
   <div id="plist" class="space-y-1 max-h-52 overflow-y-auto"></div></div>
   <div id="cart" class="${box} space-y-2"></div>`;
},
stock(){
  return `<button onclick="itemModal()" class="w-full bg-blue-700 text-white py-3 ${b('')}">${t('addItem')}</button>`+
  (items.length?items.map(i=>`<div class="${box} flex items-center justify-between gap-2"><div><div class="font-black text-xs">${esc(i.name)}</div><div class="text-[11px] font-bold text-slate-500">${fmt(i.retail)}</div></div>
   <div class="text-center"><div class="font-black text-sm ${i.stock<=5?'text-rose-600':'text-emerald-600'}">${i.stock}${i.stock<=5?' ⚠':''}</div><button onclick="itemModal('${i.id}')" class="text-[11px] font-black text-blue-700">${t('edit')}</button></div></div>`).join(''):`<div class="${box} text-center text-xs font-bold text-slate-500">${t('empty')}</div>`);
},
debts(){
  const l=parties.filter(p=>p.type==='client'&&p.id!=='p_comptoir').sort((a,c)=>c.balance-a.balance);
  return `<button onclick="partyModal()" class="w-full bg-blue-700 text-white py-3 ${b('')}">${t('newClient')}</button>`+
  (l.length?l.map(p=>`<div class="${box} flex items-center justify-between"><div><div class="font-black text-xs">${esc(p.name)}</div><div class="text-[11px] text-slate-500 font-bold">${esc(p.phone)}</div></div>
   <div class="text-center"><div class="font-black text-sm ${p.balance>0?'text-rose-600':'text-emerald-600'}">${fmt(p.balance)}</div>
   ${p.balance>0?`<button onclick="payModal('${p.id}')" class="text-[11px] font-black text-blue-700">${t('pay')}</button>`:`<button onclick="delParty('${p.id}')" class="text-[11px] font-black text-slate-400">${t('del')}</button>`}</div></div>`).join(''):`<div class="${box} text-center text-xs font-bold text-slate-500">${t('empty')}</div>`);
},
today(){
  const td=docs.filter(d=>d.day===day()),ex=expenses.filter(e=>e.day===day());
  const s=td.reduce((a,d)=>a+d.total,0),p=td.reduce((a,d)=>a+d.profit,0),x=ex.reduce((a,e)=>a+e.amount,0);
  const st=(l,v,c)=>`<div class="${box} text-center"><div class="text-[11px] font-black text-slate-500">${l}</div><div class="font-black text-sm ${c}">${fmt(v)}</div></div>`;
  return `<div class="grid grid-cols-2 gap-2">${st(t('salesT'),s,'text-blue-700')}${st(t('profit'),p,'text-emerald-600')}${st(t('expT'),x,'text-rose-600')}${st(t('net'),p-x,'text-slate-800')}</div>
  <div class="${box} space-y-2"><div class="font-black text-xs">${t('exp')}</div>
   <div class="grid grid-cols-5 gap-2"><input id="ex-n" placeholder="${t('label')}" class="${inp} col-span-3"><input id="ex-a" type="number" min="0" placeholder="${t('amount')}" class="${inp} col-span-2"></div>
   <button onclick="addExp()" class="w-full bg-blue-700 text-white ${b('')}">${t('add')}</button>
   ${ex.map(e=>`<div class="flex justify-between text-xs font-bold border-t pt-2"><span>${esc(e.name)}</span><span class="text-rose-600">${fmt(e.amount)} <button onclick="delExp('${e.id}')" class="text-slate-400 px-1">✕</button></span></div>`).join('')}</div>
  <div class="font-black text-xs pt-1">${t('history')}</div>
  ${[...docs].reverse().slice(0,30).map(d=>`<div class="${box} space-y-1"><div class="flex justify-between text-xs font-black"><span>${t('bon')} ${d.no} · ${d.day}</span><span class="text-blue-700">${fmt(d.total)}</span></div>
   <div class="text-[11px] font-bold text-slate-500">${esc(d.clientName)}${d.total>d.paid?` · <span class="text-rose-600">${t('rest')}: ${fmt(d.total-d.paid)}</span>`:''}</div>
   <div class="grid grid-cols-2 gap-2"><button onclick="printDoc('${d.id}')" class="bg-slate-100 ${b('')}">🖨 ${t('print')}</button><button onclick="delDoc('${d.id}')" class="bg-rose-50 text-rose-700 ${b('')}">${t('del')}</button></div></div>`).join('')}
  <div class="${box} space-y-2">
   <button onclick="sendWA()" class="w-full bg-emerald-600 text-white py-3 ${b('')}">${t('wa')}</button>
   <div class="grid grid-cols-2 gap-2"><button onclick="exportJSON()" class="bg-blue-700 text-white ${b('')}">${t('exp2')}</button>
   <label class="bg-slate-100 border border-slate-300 text-center cursor-pointer ${b('')}">${t('imp')}<input type="file" accept=".json" onchange="importJSON(event)" class="hidden"></label></div>
   <button onclick="resetModal()" class="w-full bg-rose-50 border border-rose-200 text-rose-700 ${b('')}">${t('reset')}</button></div>`;
}};

/* ---------- البيع ---------- */
function list(){
  const s=q.trim().toLowerCase();
  const l=items.filter(i=>!s||i.name.toLowerCase().includes(s)||String(i.barcode).includes(s)).slice(0,25);
  $('plist').innerHTML=l.map(i=>`<button onclick="addCart('${i.id}')" ${i.stock<=0?'disabled':''} class="w-full flex justify-between bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold ${i.stock<=0?'opacity-40':''}"><span>${esc(i.name)} <span class="text-slate-400">(${i.stock})</span></span><span class="text-blue-700">${fmt(i.retail)}</span></button>`).join('')||`<div class="text-xs text-slate-500 font-bold text-center">${t('empty')}</div>`;
}
function byCode(c){
  const i=items.find(x=>x.barcode&&String(x.barcode)===String(c).trim());
  if(i){addCart(i.id);q='';$('q').value='';list()}else if(String(c).trim())toast(t('notFound'));
}
function addCart(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  const c=cart.find(x=>x.id===id);
  if((c?c.qty:0)+1>i.stock)return toast(t('noStock')+i.name);
  if(c)c.qty++;else cart.push({id,name:i.name,qty:1,price:i.retail,cost:i.cost});
  drawCart();
}
function chQty(id,d){
  const c=cart.find(x=>x.id===id),i=items.find(x=>x.id===id);if(!c)return;
  if(c.qty+d>(i?i.stock:1e9))return toast(t('noStock')+c.name);
  c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);drawCart();
}
const sum=()=>cart.reduce((a,c)=>a+c.qty*c.price,0);
function drawCart(){
  const el=$('cart');if(!el)return;const pv=$('paid')?$('paid').value:'';
  el.innerHTML=`<div class="font-black text-xs">${t('cart')}</div>`+(cart.length?cart.map(c=>`<div class="flex items-center justify-between text-xs font-bold"><span class="flex-1">${esc(c.name)}<div class="text-[11px] text-slate-500">${fmt(c.price)}</div></span>
   <span class="flex items-center gap-2"><button onclick="chQty('${c.id}',-1)" class="w-7 h-7 bg-slate-100 rounded-lg font-black">−</button><b>${c.qty}</b><button onclick="chQty('${c.id}',1)" class="w-7 h-7 bg-slate-100 rounded-lg font-black">+</button></span><span class="w-24 text-end text-blue-700">${fmt(c.qty*c.price)}</span></div>`).join('')+
   `<div class="flex justify-between font-black text-sm border-t pt-2"><span>${t('total')}</span><span>${fmt(sum())}</span></div>
   <input id="paid" type="number" min="0" value="${pv}" placeholder="${t('paid')}" class="${inp}">
   <button onclick="sellNow()" class="w-full bg-emerald-600 text-white py-3 ${b('')}">${t('validate')}</button>`:`<div class="text-center text-xs text-slate-500 font-bold">${t('empty')}</div>`);
}
async function sellNow(){
  if(!cart.length)return;
  for(const c of cart){const i=items.find(x=>x.id===c.id);if(!i||c.qty>i.stock)return toast(t('noStock')+c.name)}
  const total=sum(),pv=$('paid').value,cl=parties.find(p=>p.id===client)||parties[0];
  const paid=(pv===''||cl.id==='p_comptoir')?total:Math.min(total,Math.max(0,Number(pv)));
  const no=docs.reduce((m,d)=>Math.max(m,d.no),0)+1;
  docs.push({id:'d_'+Date.now(),no,day:day(),clientId:cl.id,clientName:pName(cl),lines:cart.map(c=>({...c})),total,paid,profit:cart.reduce((a,c)=>a+(c.price-c.cost)*c.qty,0)});
  cart.forEach(c=>{items.find(x=>x.id===c.id).stock-=c.qty});
  cl.balance+=total-paid;cart=[];q='';
  await persist();toast(t('saved')+' #'+no);render();
}
function delDoc(id){
  if(!confirm(t('confirmDel')))return;
  const d=docs.find(x=>x.id===id);if(!d)return;
  d.lines.forEach(l=>{const i=items.find(x=>x.id===l.id);if(i)i.stock+=l.qty});
  const p=parties.find(x=>x.id===d.clientId);if(p)p.balance=Math.max(0,p.balance-(d.total-d.paid));
  docs=docs.filter(x=>x.id!==id);persist();render();
}
function printDoc(id){
  const d=docs.find(x=>x.id===id);if(!d)return;
  const r=(a,v)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${v}</span></div>`;
  $('receipt').innerHTML=`<div dir="${lang==='ar'?'rtl':'ltr'}" style="max-width:320px;margin:auto"><h2 style="text-align:center;font-weight:900">${t('app')}</h2><p>${t('bon')} ${d.no} — ${d.day}</p><p>${esc(d.clientName)}</p><hr>
  ${d.lines.map(l=>r(esc(l.name)+' ×'+l.qty,fmt(l.qty*l.price))).join('')}<hr><b>${r(t('total'),fmt(d.total))}</b>${r(t('rest'),fmt(d.total-d.paid))}</div>`;
  window.print();
}

/* ---------- السلع ---------- */
function itemModal(id){
  const i=items.find(x=>x.id===id)||{name:'',barcode:'',cost:'',retail:'',stock:''};
  modal(`<form onsubmit="saveItem(event,'${id||''}')" class="space-y-2">${fld('i-name',t('name'),i.name,'text','required')}
   <div class="grid grid-cols-2 gap-2">${fld('i-ret',t('price'),i.retail,'number','min="0" required')}${fld('i-cost',t('cost'),i.cost,'number','min="0" required')}</div>
   ${fld('i-stock',t('qty'),i.stock,'number','min="0" required')}${fld('i-bar',t('barcode'),i.barcode)}${btns('bg-blue-700')}
   ${id?`<button type="button" onclick="delItem('${id}')" class="w-full bg-rose-50 text-rose-700 ${b('')}">${t('del')}</button>`:''}</form>`);
}
function saveItem(e,id){
  e.preventDefault();const n=x=>Math.max(0,Number($(x).value||0));
  const o={name:$('i-name').value.trim(),barcode:$('i-bar').value.trim(),cost:n('i-cost'),retail:n('i-ret'),stock:n('i-stock')};
  if(!o.name)return toast(t('nameReq'));
  if(id)Object.assign(items.find(x=>x.id===id),o);else items.push({id:'i_'+Date.now(),...o});
  persist();closeModal();render();
}
function delItem(id){if(!confirm(t('confirmDel')))return;items=items.filter(x=>x.id!==id);cart=cart.filter(c=>c.id!==id);persist();closeModal();render()}

/* ---------- الزبائن ---------- */
function partyModal(){
  modal(`<form onsubmit="saveParty(event)" class="space-y-2">${fld('p-name',t('name'),'','text','required')}${fld('p-phone',t('phone'),'','tel')}${fld('p-bal',t('oldDebt')+' ('+t('cur')+')',0,'number','min="0"')}${btns('bg-blue-700')}</form>`);
}
async function saveParty(e){
  e.preventDefault();const name=$('p-name').value.trim();if(!name)return toast(t('nameReq'));
  const id='p_'+Date.now();
  parties.push({id,type:'client',name,phone:$('p-phone').value.trim(),balance:Math.max(0,Number($('p-bal').value||0))});
  client=id;await persist();closeModal();render();
}
function delParty(id){if(!confirm(t('confirmDel')))return;parties=parties.filter(p=>p.id!==id);if(client===id)client='p_comptoir';persist();render()}
function payModal(id){
  const p=parties.find(x=>x.id===id);if(!p)return;
  modal(`<div class="font-black text-sm">${esc(p.name)} — <span class="text-rose-600">${fmt(p.balance)}</span></div><form onsubmit="savePay(event,'${id}')" class="space-y-2">${fld('pay-a',t('amount'),p.balance,'number','min="1" max="'+p.balance+'" required')}${btns('bg-emerald-600')}</form>`);
}
async function savePay(e,id){
  e.preventDefault();const p=parties.find(x=>x.id===id);if(!p)return;
  p.balance=Math.max(0,p.balance-Math.min(p.balance,Math.max(0,Number($('pay-a').value||0))));
  await persist();closeModal();toast(t('paidOK'));render();
}

/* ---------- المصاريف ---------- */
function addExp(){
  const n=$('ex-n').value.trim(),a=Number($('ex-a').value||0);
  if(!n||a<=0)return toast(t('nameReq'));
  expenses.push({id:'e_'+Date.now(),day:day(),name:n,amount:a});persist();render();
}
function delExp(id){expenses=expenses.filter(e=>e.id!==id);persist();render()}

/* ---------- النسخ الاحتياطي ---------- */
function exportJSON(){
  const f=new Blob([JSON.stringify({v:1,items,parties,docs,expenses})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='albaraka_'+day()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.items)||!Array.isArray(d.parties)||!Array.isArray(d.docs))throw 0;
      if(!confirm(t('confirmImp')))return;
      items=d.items;parties=d.parties;docs=d.docs;expenses=Array.isArray(d.expenses)?d.expenses:[];
      if(!parties.some(p=>p.id==='p_comptoir'))parties.unshift(COMPTOIR());
      cart=[];await persist();toast(t('imported'));render();
    }catch(e){toast(t('badFile'))}
  };
  r.readAsText(f);ev.target.value='';
}
function sendWA(){
  exportJSON();
  const td=docs.filter(d=>d.day===day()),x=expenses.filter(e=>e.day===day()).reduce((a,e)=>a+e.amount,0);
  const s=td.reduce((a,d)=>a+d.total,0),p=td.reduce((a,d)=>a+d.profit,0),rc=parties.filter(c=>c.type==='client').reduce((a,c)=>a+c.balance,0);
  const txt=`*${t('app')}* — ${day()}\n${t('salesT')}: ${fmt(s)} (${td.length})\n${t('profit')}: ${fmt(p)}\n${t('expT')}: ${fmt(x)}\n${t('debts')}: ${fmt(rc)}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function resetModal(){
  modal(`<h3 class="font-black text-base text-rose-700">${t('reset')}</h3><p class="text-slate-600 font-bold leading-relaxed">${t('resetWarn')}</p>
   <div class="grid grid-cols-2 gap-2 pt-2"><button onclick="closeModal()" class="bg-slate-100 py-3 ${b('')}">${t('cancel')}</button><button onclick="doReset()" class="bg-rose-600 text-white py-3 ${b('')}">${t('confirm')}</button></div>`);
}
async function doReset(){
  items=[];parties=[COMPTOIR()];docs=[];expenses=[];cart=[];client='p_comptoir';
  await persist();closeModal();render();toast(t('resetDone'));
}

window.addEventListener('DOMContentLoaded',async()=>{await load();render()});
</script>
</body>
</html>
